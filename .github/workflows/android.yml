name: Build Android app

on:
  push:
    branches: [main]
    # Content updates (destinations and photos) load live in the app,
    # so they do not need a new build.
    paths-ignore:
      - 'data/**'
      - 'assets/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Match package versions to the Expo SDK
        run: npx expo install --fix

      - name: Create Android project
        env:
          CI: 1
        run: |
          npx expo prebuild --platform android --no-install
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          cp app/build/outputs/apk/release/app-release.apk ../Nextscape.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Nextscape-apk
          path: Nextscape.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nextscape build ${{ github.run_number }}
          body: Download Nextscape.apk on your phone and open it to install or update.
          files: Nextscape.apk
          make_latest: true
